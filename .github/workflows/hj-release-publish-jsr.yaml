# Generated by hj release publication. Do not edit.
# hj-workflow-cli: jsr-latest
name: Publish JSR package

on:
  repository_dispatch:
    types: [hj-release-publish-tag-success]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unprefixed SemVer tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

cache-mode: read

concurrency:
  group: hj-release-publish-jsr-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-jsr:
    if: github.event_name == 'workflow_dispatch' || github.sha == github.event.client_payload.releaseSha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.releaseSha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HJ_RELEASE_ROUTE: ${{ github.event_name == 'repository_dispatch' && 'event' || 'user' }}
          HJ_RELEASE_SCHEMA: ${{ github.event.client_payload.schema }}
          HJ_RELEASE_SHA: ${{ github.event.client_payload.releaseSha }}
          HJ_RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
          HJ_RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: >-
          deno run --no-lock
          --allow-env=PATH,GITHUB_REPOSITORY,GITHUB_SHA,HJ_RELEASE_ROUTE,HJ_RELEASE_SCHEMA,HJ_RELEASE_SHA,HJ_RELEASE_TAG,HJ_RELEASE_VERSION
          --allow-read=.
          --allow-net=api.jsr.io,jsr.io,rekor.sigstore.dev
          --allow-run=deno,git
          --no-config --min-dep-age=0 --reload=https://jsr.io/@hugojosefson/cli jsr:@hugojosefson/cli
          release publish-jsr
  dispatch-tag:
    if: github.event_name == 'repository_dispatch' && github.sha != github.event.client_payload.releaseSha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start publication at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HJ_RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: >-
          gh workflow run hj-release-publish-jsr.yaml
          --repo "$GH_REPO" --ref "$HJ_RELEASE_TAG"
          -f "tag=$HJ_RELEASE_TAG"
