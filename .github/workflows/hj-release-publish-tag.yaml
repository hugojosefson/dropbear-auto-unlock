# Generated by hj release publication. Do not edit.
# hj-workflow-cli: jsr-latest
name: Publish release tag

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or missing release tag
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: hj-release-publish-tag-main
  cancel-in-progress: false

jobs:
  publish-tag-prepare:
    cache-mode: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release-needed: ${{ steps.prepare.outputs.release-needed }}
      release-bundle: ${{ steps.prepare.outputs.release-bundle }}
      bundle-digest: ${{ steps.prepare.outputs.bundle-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - name: Cache native test npm downloads
        if: hashFiles('scripts/test-build/dependencies/package-lock.json') != '' && hashFiles('scripts/test-build/tools/package-lock.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: native-test-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-build/dependencies/package-lock.json', 'scripts/test-build/tools/package-lock.json', 'toolchain.json') }}
          restore-keys: |
            native-test-npm-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HJ_RELEASE_ROUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && 'recovery' || 'usual' }}
          HJ_RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          deno run --no-lock
          --allow-env=PATH,GITHUB_REPOSITORY,GITHUB_OUTPUT,GITHUB_STEP_SUMMARY,HJ_RELEASE_ROUTE,HJ_RELEASE_TAG,ESBUILD_BINARY_PATH,ESBUILD_WORKER_THREADS
          --allow-read=.,/tmp/opencode
          --allow-write=deno.json,deno.jsonc,CHANGELOG.md,/tmp/opencode,"${GITHUB_OUTPUT}","${GITHUB_STEP_SUMMARY}"
          --allow-run=deno,git
          --no-config --min-dep-age=0 --reload=https://jsr.io/@hugojosefson/cli jsr:@hugojosefson/cli
          release publish-tag-prepare
  publish-tag-apply:
    needs: publish-tag-prepare
    if: needs.publish-tag-prepare.outputs.release-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - env:
          GH_TOKEN: ${{ github.token }}
          HJ_RELEASE_ROUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && 'recovery' || 'usual' }}
          HJ_RELEASE_BUNDLE: ${{ needs.publish-tag-prepare.outputs.release-bundle }}
          HJ_RELEASE_BUNDLE_DIGEST: ${{ needs.publish-tag-prepare.outputs.bundle-digest }}
        run: >-
          deno run --no-lock
          --allow-env=PATH,GITHUB_REPOSITORY,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_SERVER_URL,GITHUB_STEP_SUMMARY,HJ_RELEASE_BUNDLE,HJ_RELEASE_BUNDLE_DIGEST,HJ_RELEASE_ROUTE
          --allow-read=.,/tmp/opencode
          --allow-write=deno.json,deno.jsonc,CHANGELOG.md,/tmp/opencode,"${GITHUB_STEP_SUMMARY}"
          --allow-run=deno,gh,git
          --no-config --min-dep-age=0 --reload=https://jsr.io/@hugojosefson/cli jsr:@hugojosefson/cli
          release publish-tag-apply
