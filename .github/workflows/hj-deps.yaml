# Generated by hj github-ci. Do not edit.
name: Update dependencies

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: hj-deps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      head: ${{ steps.update.outputs.head }}
      base: ${{ steps.update.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - name: Update dependencies
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch="hj/deps"
          base="${{ github.event.repository.default_branch }}"
          git fetch origin "${branch}" || true
          remote_branch="$(git rev-parse --verify "refs/remotes/origin/${branch}" 2>/dev/null || true)"
          git switch --force-create "${branch}" "${GITHUB_SHA}"
          if NO_COLOR=1 deno task 2>&1 | grep --quiet --fixed-strings --line-regexp -- "- update-dependencies"; then
            deno task update-dependencies
          else
            deno outdated --recursive --update --latest
          fi
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: update dependencies"
          if [ -n "${remote_branch}" ]; then
            git push --force-with-lease="refs/heads/${branch}:${remote_branch}" \
              origin "${branch}:refs/heads/${branch}"
          else
            git push origin "${branch}:refs/heads/${branch}"
          fi
          open_pr_count="$(gh pr list --head "${branch}" --state open --json url --jq length)"
          if [ "${open_pr_count}" = "0" ]; then
            gh pr create --base "${base}" --head "${branch}" \
              --title "chore: update dependencies" \
              --body "Updates dependencies to their latest versions."
          fi
          printf 'head=%s\nbase=%s\n' "$(git rev-parse HEAD)" "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
