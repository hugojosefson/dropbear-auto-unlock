# Generated by hj github-ci. Do not edit.
name: CI

on:
  pull_request:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: hj-ci-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - run: deno task all
  hj-release-commit-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true
          cache-hash: deno-2.9.6-${{ hashFiles('**/deno.lock', 'toolchain.json') }}
      - name: Validate release commits
        env:
          HJ_RELEASE_ROUTE: source-validation
          HJ_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HJ_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          deno run --no-lock
          --allow-env=HJ_RELEASE_ROUTE,HJ_SOURCE_BASE_SHA,HJ_SOURCE_HEAD_SHA
          --allow-run=git
          jsr:@hugojosefson/cli@0.16.1
          release publish-tag-prepare
